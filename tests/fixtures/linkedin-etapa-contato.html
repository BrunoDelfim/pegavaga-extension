<script>
  /* O LinkedIn: os valores de PERFIL chegam DEPOIS de montar o formulário (é o
   * React escrevendo a propriedade, não o atributo). A etapa fica em branco por um
   * instante — e era nesse instante que o cartão abria pedindo tudo de novo. */
  setTimeout(function () {
    var porId = function (id) { return document.getElementById(id); };

    if (porId('form-element-nome')) porId('form-element-nome').value = 'Bruno';
    if (porId('form-element-sobrenome')) porId('form-element-sobrenome').value = 'Delfim';
    if (porId('form-element-telefone')) porId('form-element-telefone').value = '11999998888';
    if (porId('form-element-pais')) porId('form-element-pais').value = 'Brazil (+55)';
    if (porId('form-element-email')) porId('form-element-email').value = 'brn.dfm@gmail.com';
  }, 300);
</script>
